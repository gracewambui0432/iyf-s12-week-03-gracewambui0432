<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - Button Styles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Day 1: Button Styles</h1>
    <p>Different button designs using CSS</p>
</header>

<main class="container">

    <section class="button-section">

        <h2>Button Examples</h2>

        <button class="btn btn-primary">
            Primary Button
        </button>

        <button class="btn btn-secondary">
            Secondary Button
        </button>

        <button class="btn btn-danger">
            Danger Button
        </button>

        <button class="btn btn-disabled" disabled>
            Disabled Button
        </button>

    </section>

</main>

<footer>
    <p>&copy; 2026 HTML Daily Challenges</p>
</footer>

</body>
</html>
